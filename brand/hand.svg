<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <!-- Soft shadow of a hand reaching in from below and pinching the card's edge.
       Replace this file with a photographed/illustrated hand PNG/SVG to change the look. -->
